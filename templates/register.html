<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OCALL - Register</title>
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}
body{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:linear-gradient(135deg,#0f172a,#1e3a8a);
padding:20px;
}
.register-container{
width:100%;
max-width:430px;
background:#ffffff;
border-radius:18px;
padding:35px;
box-shadow:0 20px 50px rgba(0,0,0,0.25);
}
.logo{
text-align:center;
margin-bottom:8px;
font-size:32px;
font-weight:700;
color:#2563eb;
}
.subtitle{
text-align:center;
color:#64748b;
font-size:14px;
margin-bottom:28px;
}
.messages{
margin-bottom:18px;
}
.message{
padding:12px 14px;
border-radius:8px;
background:#fee2e2;
color:#b91c1c;
font-size:14px;
margin-bottom:8px;
}
.form-group{
margin-bottom:17px;
}
.form-group label{
display:block;
font-size:14px;
font-weight:600;
color:#334155;
margin-bottom:7px;
}
.form-group input{
width:100%;
padding:13px 14px;
border:1px solid #cbd5e1;
border-radius:9px;
outline:none;
font-size:15px;
transition:0.2s;
}
.form-group input:focus{
border-color:#2563eb;
box-shadow:0 0 0 3px rgba(37,99,235,0.12);
}
.register-btn{
width:100%;
border:none;
padding:14px;
border-radius:9px;
background:#2563eb;
color:#ffffff;
font-size:16px;
font-weight:600;
cursor:pointer;
transition:0.2s;
margin-top:5px;
}
.register-btn:hover{
background:#1d4ed8;
}
.login-text{
text-align:center;
margin-top:22px;
font-size:14px;
color:#64748b;
}
.login-text a{
color:#2563eb;
font-weight:600;
text-decoration:none;
}
.login-text a:hover{
text-decoration:underline;
}
.footer{
text-align:center;
margin-top:20px;
font-size:12px;
color:#94a3b8;
}
</style>
</head>
<body>
<div class="register-container">
<div class="logo">OCALL</div>
<p class="subtitle">Create your account and start connecting</p>
{% if messages %}
<div class="messages">
{% for message in messages %}
<p class="message">{{ message }}</p>
{% endfor %}
</div>
{% endif %}
<form method="POST">
{% csrf_token %}
<div class="form-group">
<label for="username">Username</label>
<input type="text" id="username" name="username" placeholder="Enter your username" required>
</div>
<div class="form-group">
<label for="email">Email Address</label>
<input type="email" id="email" name="email" placeholder="Enter your email address" required>
</div>
<div class="form-group">
<label for="password">Password</label>
<input type="password" id="password" name="password" placeholder="Create a password" required>
</div>
<div class="form-group">
<label for="confirm_password">Confirm Password</label>
<input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm your password" required>
</div>
<button type="submit" class="register-btn">Create Account</button>
</form>
<p class="login-text">Already have an account? <a href="{% url 'login' %}">Login</a></p>
<p class="footer">© 2026 OCALL. All rights reserved.</p>
</div>
</body>
</html>
